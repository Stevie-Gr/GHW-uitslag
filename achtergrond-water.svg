<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lucht" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07131d"/>
      <stop offset=".35" stop-color="#16283a"/>
      <stop offset=".62" stop-color="#5a4a55"/>
      <stop offset=".80" stop-color="#c9764a"/>
      <stop offset="1" stop-color="#f0a85e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
